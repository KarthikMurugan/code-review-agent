services:
  api:
    build: .
    image: learning-review-agent:local
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:?Set GITHUB_WEBHOOK_SECRET}
      REVIEW_API_TOKEN: ${REVIEW_API_TOKEN:?Set REVIEW_API_TOKEN}
      REVIEW_DB_PATH: /data/reviews.sqlite3
    volumes:
      - review-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
  worker:
    build: .
    image: learning-review-agent:local
    command: ["review-worker"]
    environment:
      GITHUB_APP_ID: ${GITHUB_APP_ID:?Set GITHUB_APP_ID}
      GITHUB_PRIVATE_KEY_FILE: /run/secrets/github-app.pem
      NEBIUS_API_KEY: ${NEBIUS_API_KEY:?Set NEBIUS_API_KEY}
      NEBIUS_BASE_URL: ${NEBIUS_BASE_URL:-https://api.tokenfactory.nebius.com/v1}
      REVIEW_MODEL: ${REVIEW_MODEL:-nebius:moonshotai/Kimi-K2.7-Code}
      REVIEW_TIMEOUT_SECONDS: ${REVIEW_TIMEOUT_SECONDS:-480}
      REVIEW_DB_PATH: /data/reviews.sqlite3
    secrets:
      - source: github-app-key
        target: github-app.pem
    volumes:
      - review-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    restart: unless-stopped
secrets:
  github-app-key:
    file: ${GITHUB_PRIVATE_KEY_FILE:?Set GITHUB_PRIVATE_KEY_FILE}
volumes:
  review-data:
